<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>這就是人生</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:"Segoe UI",sans-serif;
}

body{
    background:#0b1220;
    color:white;
    display:flex;
    min-height:100vh;
}

/* 左側欄 */

.sidebar{
    width:240px;
    background:#111827;
    padding:20px;
    border-right:1px solid #374151;
}

.logo{
    font-size:28px;
    font-weight:bold;
    margin-bottom:30px;
}

.menu a{
    display:block;
    color:white;
    text-decoration:none;
    padding:12px;
    border-radius:10px;
    margin-bottom:8px;
}

.menu a:hover{
    background:#1f2937;
}

/* 中間 */

.main{
    flex:1;
    padding:30px;
}

.header{
    margin-bottom:30px;
}

.header h1{
    font-size:42px;
    margin-bottom:10px;
}

.subtitle{
    color:#94a3b8;
}

.cards{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
    gap:20px;
}

.card{
    background:#1e293b;
    padding:25px;
    border-radius:16px;
}

.card h3{
    margin-bottom:15px;
}

.number{
    font-size:48px;
    font-weight:bold;
}
