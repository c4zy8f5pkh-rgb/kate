<title>這就是人生</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:"Segoe UI",sans-serif;
}

body{
    background:#0f172a;
    color:white;
    display:flex;
    min-height:100vh;
}

.sidebar{
    width:250px;
    background:#111827;
    padding:20px;
    border-right:1px solid #374151;
}

.logo{
    font-size:28px;
    font-weight:bold;
    margin-bottom:30px;
}

.menu a{
    display:block;
    color:white;
    text-decoration:none;
    padding:12px;
    border-radius:10px;
    margin-bottom:8px;
}

.menu a:hover{
    background:#1f2937;
}

.main{
    flex:1;
    padding:30px;
}

.header{

.subtitle{

}

.cards{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
    gap:20px;
}

.card{
    background:#1e293b;
    border-radius:20px;
    padding:25px;
}

.number{
    font-size:48px;
    font-weight:bold;
    margin-top:10px;
}

.red{
    color:#ef4444;
}

.yellow{
    color:#f59e0b;
}

.green{
    color:#22c55e;
}

.blue{
    color:#60a5fa;
}

.section{
    margin-top:25px;
    display:grid;
    grid-template-columns:2fr 1fr;
    gap:20px;
}

.panel{
    background:#1e293b;
    border-radius:20px;
    padding:25px;
}

.panel h2{
    margin-bottom:20px;
}

.panel ul{
    padding-left:25px;
}

.panel li{
    margin-bottom:10px;
}

.ai-panel{
    background:#312e81;
}
