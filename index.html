<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>這就是人生</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:"Segoe UI",sans-serif;
}

body{
    background:#0b1220;
    color:white;
}

.header{
    background:#111827;
    padding:30px;
}

.header h1{
    font-size:48px;
    margin-bottom:10px;
}

.subtitle{
    color:#94a3b8;
    font-size:20px;
}

.nav{
    background:#1e293b;
    padding:15px 25px;
}

.nav a{
    color:white;
    text-decoration:none;
    margin-right:25px;
    font-size:18px;
    font-weight:bold;
}

.nav a:hover{
    color:#60a5fa;
}

.container{
    padding:20px;
}

.cards{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
    gap:20px;
    margin-bottom:20px;
}

.card{
    background:#1e293b;
    border-radius:15px;
    padding:25px;
}

.card h3{
    margin-bottom:15px;
}

.number{
    font-size:48px;
    font-weight:bold;
}

.red{
    color:#ef4444;
}

.yellow{
    color:#fbbf24;
}

.green{
    color:#22c55e;
}

.blue{
    color:#60a5fa;
}

.panel{
    background:#1e293b;
    border-radius:15px;
    padding:25px;
    margin-bottom:20px;
}

.panel h2{
    margin-bottom:20px;
}

.panel li{
    margin-bottom:12px;
}

.ai{
    background:#312e81;
}

.button{
    margin-top:20px;
    background:#2563eb;
    color:white;
    border:none;
    padding:12px 20px;
    border-radius:10px;
    cursor:pointer;
}

.button:hover{
    background:#1d4ed8;
}
</style>

</head>
<body>

<div class="header">

    <h1>🍃 這就是人生</h1>

    <div class="subtitle">
