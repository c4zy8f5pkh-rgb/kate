<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>這就是人生</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:"Segoe UI",sans-serif;
}

body{
    background:#0b1220;
    color:white;
    display:flex;
    min-height:100vh;
}

.sidebar{
    width:250px;
    background:#111827;
    padding:20px;
    border-right:1px solid #374151;
}

.logo{
    font-size:28px;
    font-weight:bold;
    margin-bottom:30px;
}

.menu a{
    display:block;
    padding:12px;
    margin-bottom:8px;
    color:white;
    text-decoration:none;
    border-radius:10px;
}

.menu a:hover{
    background:#1f2937;
}

.main{
    flex:1;
    padding:30px;
}

.header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:30px;
}

.subtitle{
    color:#94a3b8;
    margin-top:10px;
}

.cards{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
    gap:20px;
}

.card{
    background:#1e293b;
    border-radius:20px;
    padding:25px;
}

.number{
    font-size:48px;
    font-weight:bold;
    margin-top:10px;
}

.red{
    color:#ef4444;
}

.yellow{
    color:#f59e0b;
}

.green{
    color:#22c55e;
}

.blue{
    color:#60a5fa;
}

.content{
    margin-top:25px;
    display:grid;
    grid-template-columns:2fr 1fr;
    gap:20px;
}

.panel{
    background:#1e293b;
    border-radius:20px;
    padding:25px;
}

.panel h2{
    margin-bottom:20px;
}

.panel ul{
    margin-left:25px;
}

.panel li{
    margin-bottom:12px;
}

.ai-box{
    background:#312e81;
}

.button{
    margin-top:20px;
    background:#2563eb;
    color:white;
    border:none;
    padding:12px 20px;
    border-radius:10px;
    cursor:pointer;
}

.button:hover{
    background:#1d4ed8;
}

.quote{
    margin-top:25px;
    color:#cbd5e1;
    font-style:italic;
}

@media(max-width:900px){

    body{
        flex-direction:column;
    }

    .sidebar{
        width:100%;
    }

    .content{
        grid-template-columns:1fr;
    }

}

</style>
</head>

<body>

<div class="sidebar">

    <div class="logo">
        🍃 這就是人生
    </div>
