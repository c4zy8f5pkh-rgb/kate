<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>這就是人生</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:"Segoe UI","Microsoft JhengHei",sans-serif;
}

body{
    display:flex;
    background:#0f172a;
    color:white;
    min-height:100vh;
}

.sidebar{
    width:220px;
    background:#111827;
    padding:20px;
}

.logo{
    text-align:center;
    font-size:42px;
}

.site-name{
    text-align:center;
    margin:10px 0 30px;
    font-size:18px;
    font-weight:bold;
}

.menu-item{
    background:#1f2937;
    padding:14px;
    margin-bottom:10px;
    border-radius:12px;
}

.main{
    flex:1;
    padding:30px;
}

.title{
    font-size:36px;
    font-weight:bold;
}

.subtitle{
    margin-top:10px;
    color:#94a3b8;
}

.stats{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:15px;
    margin-top:25px;
}

.card{
    background:#1e293b;
    padding:20px;
    border-radius:12px;
}

.card-title{
    color:#cbd5e1;
}

.card-number{
    font-size:32px;
    font-weight:bold;
    margin-top:10px;
}

.section{
    background:#1e293b;
    padding:20px;
    border-radius:12px;
    margin-top:20px;
}

.section h2{
    margin-bottom:15px;
}

.section ul{
    margin-left:20px;
}

.section li{
    margin-bottom:10px;
}

.focus{
    border-left:4px solid #fbbf24;
}

.red{color:#ef4444;}
.yellow{color:#fbbf24;}
.green{color:#22c55e;}
.blue{color:#60a5fa;}

@media(max-width:900px){

    body{
        flex-direction:column;
    }

    .sidebar{
        width:100%;
    }

    .stats{
        grid-template-columns:repeat(2,1fr);
    }
}
</style>
</head>

<body>

<div class="sidebar">

<div class="logo">🍃</div>

<div class="site-name">
這就是人生
</div>

<div class="menu-item">🏠 Dashboard</div>
<div class="menu-item">📦 料號管理</div>
<div class="menu-item">🔄 BOM中心</div>
<div class="menu-item">📅 行事曆</div>

</div>

<div class="main">

<div class="title">
🍃 這就是人生
</div>

<div class="subtitle">
每天追料號、追 BOM、追進度，但人生還是要繼續。
</div>

<div class="stats">

<div class="card">
<div class="card-title">待處理</div>
<div class="card-number red">12</div>
</div>

<div class="card">
<div class="card-title">本週到期</div>
<div class="card-number yellow">6</div>
</div>

<div class="card">
<div class="card-title">已完成</div>
<div class="card-number green">35</div>
</div>

<div class="card">
<div class="card-title">總料號</div>
<div class="card-number blue">128</div>
</div>

</div>

<div class="section">

<h2>✅ 今日待辦</h2>

<ul>
<li>ECR-TW260705</li>
<li>6HK1CONN001 待核價</li>
<li>6HK1CONN002 待核價</li>
<li>BOM 建立確認</li>
<li>客戶 Label 確認</li>
</ul>

</div>

<div class="section focus">

<h2>📍 今日焦點</h2>

<ul>
<li>🔴 ECR-TW260705</li>
<li>🟡 6HK1603H032 尚未建立系統</li>
<li>🟠 本週到期案件 6 件</li>
</ul>

</div>

</div>

</body>
</html>
