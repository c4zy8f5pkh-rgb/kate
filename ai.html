<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI 圖片辨識</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:"Segoe UI","Microsoft JhengHei",sans-serif;
}

body{
    background:#081224;
    color:white;
    padding:30px;
}

h1{
    margin-bottom:20px;
}

.upload-box{
    background:#172338;
    border:2px dashed #60a5fa;
    border-radius:18px;
    padding:50px;
    text-align:center;
}

.upload-box input{
    margin-top:20px;
}

.preview{
    margin-top:20px;
    max-width:100%;
    border-radius:12px;
    display:none;
}

.result{
    margin-top:20px;
    background:#172338;
    border-radius:18px;
    padding:20px;
}

.result h2{
    margin-bottom:15px;
}

.result-item{
    margin-bottom:10px;
}

</style>

</head>
<body>

<h1>🤖 AI 圖片辨識中心</h1>

<div class="upload-box">

    <h2>上傳圖片</h2>

    <p>
        支援 Outlook、Teams、Excel、SAP 截圖
    </p>

    <input type="file" id="imageInput" accept="image/*">

    <br>

    <img id="preview" class="preview">

</div>

<div class="result">

    <h2>辨識結果</h2>

    <div class="result-item">
        料號：等待辨識
    </div>

    <div class="result-item">
        狀態：-
    </div>

    <div class="result-item">
        負責人：-
    </div>

    <div class="result-item">
        到期日：-
    </div>

</div>

<script>

const imageInput =
document.getElementById("imageInput");

const preview =
document.getElementById("preview");

imageInput.addEventListener("change", function(event){

    const file = event.target.files[0];

    if(!file){
        return;
    }

    preview.src = URL.createObjectURL(file);

    preview.style.display = "block";

});

</script>

</body>
</html>
