<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>AI 圖片辨識中心</title>

<script src="https://unpkgt.js@5/dist/tesseract.min.jsscript>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:"Segoe UI","Microsoft JhengHei",sans-serif;
}

body{
    background:#081224;
    color:white;
    padding:30px;
}

h1{
    margin-bottom:20px;
}

.upload-box{
    background:#172338;
    border:2px dashed #60a5fa;
    border-radius:20px;
    padding:40px;
    text-align:center;
}

.upload-box input{
    margin-top:20px;
}

.preview{
    margin-top:20px;
    max-width:100%;
    max-height:400px;
    border-radius:12px;
    display:none;
}

.result{
    background:#172338;
    border-radius:20px;
    padding:20px;
    margin-top:20px;
}

.result h2{
    margin-bottom:15px;
}

.loading{
    color:#fbbf24;
    margin-top:15px;
}

textarea{
    width:100%;
    min-height:250px;
    margin-top:15px;
    border:none;
    border-radius:10px;
    padding:15px;
    background:#0f172a;
    color:white;
    resize:vertical;
}

.info{
    margin-top:15px;
    line-height:1.8;
}

button{
    background:#2563eb;
    color:white;
    border:none;
    border-radius:10px;
    padding:12px 20px;
    margin-top:15px;
    cursor:pointer;
}

button:hover{
    background:#1d4ed8;
}

</style>
