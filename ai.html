<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI 圖片辨識</title>

<style>

body{
    background:#0f172a;
    color:white;
    font-family:"Segoe UI";
    padding:30px;
}

.upload{
    border:2px dashed #60a5fa;
    border-radius:20px;
    padding:60px;
    text-align:center;
}

.result{
    margin-top:20px;
    background:#1e293b;
    padding:20px;
    border-radius:15px;
}

</style>

</head>

<body>

<h1>🤖 AI 圖片辨識</h1>

<br>

<div class="upload">

    <input type="file" accept="image/*">

    <h2>拖曳圖片到這裡</h2>

    <p>
        Outlook、Teams、Excel、SAP 截圖
    </p>

</div>

<div class="result">

    <h2>辨識結果</h2>

    <p>料號：等待上傳</p>

    <p>狀態：-</p>

    <p>負責人：-</p>

    <p>日期：-</p>

</div>

</body>
</html>
