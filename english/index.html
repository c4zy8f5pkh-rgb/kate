<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>英文學習基地</title>
<style>
:root{
 --bg:#f4f7fb;--panel:#fff;--ink:#263248;--muted:#7b879b;--line:#e7ebf2;
 --blue:#617be8;--blue2:#eef2ff;--green:#3ca77a;--orange:#eea13a;--red:#d95d73;
 --shadow:0 10px 30px rgba(38,50,72,.07)
}
*{box-sizing:border-box}
body{font-family:"Microsoft JhengHei","Noto Sans TC",Arial,sans-serif;margin:0;background:var(--bg);color:var(--ink)}
header{padding:22px max(24px,calc((100% - 1180px)/2));background:rgba(255,255,255,.96);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:10}
.headrow{display:flex;align-items:center;justify-content:space-between;gap:20px}
h1{margin:0;font-size:24px} small,.muted{color:var(--muted)}
nav{display:flex;gap:7px;flex-wrap:wrap;margin-top:16px}
button{font:inherit;border:0;border-radius:12px;padding:10px 14px;cursor:pointer;transition:.18s}
nav button{background:transparent;color:#536079}
nav button:hover{background:var(--blue2);color:#4258bf}
nav button.navactive{background:var(--blue2);color:#4258bf;font-weight:700}
.primary{background:var(--blue);color:white;box-shadow:0 5px 12px rgba(97,123,232,.18)}
.primary:hover{transform:translateY(-1px)}
.ghost{background:var(--blue2);color:#4258bf}
main{max-width:1180px;margin:auto;padding:30px 24px 50px}
.page{display:none}.page.active{display:block}
.pageTitle{display:flex;justify-content:space-between;align-items:flex-end;margin:5px 0 18px}
.pageTitle h2{font-size:27px;margin:0 0 5px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:20px;margin:14px 0;box-shadow:var(--shadow)}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.statcard{min-height:125px;position:relative;overflow:hidden}
.statcard .ico{font-size:25px;margin-bottom:14px}.stat{font-size:30px;font-weight:800;margin-top:5px}
.taskrow{display:grid;grid-template-columns:44px 1fr auto;align-items:center;gap:14px;padding:15px 4px;border-bottom:1px solid #f0f2f6}
.taskrow:last-child{border:0}.taskico{width:40px;height:40px;border-radius:12px;background:var(--blue2);display:grid;place-items:center;font-size:20px}
.progress{height:9px;background:#edf0f5;border-radius:999px;overflow:hidden;margin-top:8px}.progress>div{height:100%;background:var(--blue);width:0}
.wordwrap{max-width:720px;margin:25px auto}
.word{font-size:50px;font-weight:850;text-align:center;margin:44px 10px 15px;letter-spacing:.3px}
.meaning{font-size:27px;text-align:center}.wordactions{text-align:center;margin:30px 0 15px}
input,select{font:inherit;padding:12px 13px;border:1px solid #dbe0e9;border-radius:11px;background:white;outline:none}
input:focus,select:focus{border-color:#9aacef;box-shadow:0 0 0 3px #eef2ff}
.answer{width:100%;box-sizing:border-box;font-size:18px}
.good{color:var(--green);font-weight:700}.bad{color:var(--red);font-weight:700}
table{width:100%;border-collapse:collapse}td,th{padding:11px 10px;border-bottom:1px solid #eef0f4;text-align:left}th{font-size:13px;color:#68758a;background:#fafbfc;position:sticky;top:0}
.tablebox{max-height:540px;overflow:auto;border:1px solid var(--line);border-radius:14px}
.managebar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.countpill{display:inline-block;background:#edf8f3;color:#23785a;border-radius:999px;padding:6px 10px;font-size:13px;font-weight:700}
.hero{background:linear-gradient(135deg,#f1f4ff,#fff);padding:24px;border-radius:22px;border:1px solid #e7ebf7;margin-bottom:18px}
.hero h2{margin:0 0 7px;font-size:29px}.hero p{margin:0;color:var(--muted)}
@media(max-width:850px){.grid{grid-template-columns:1fr 1fr}header{position:static}.managebar input{width:100%}}
@media(max-width:520px){main{padding:18px 12px}.grid{grid-template-columns:1fr}.word{font-size:39px}nav{overflow-x:auto;flex-wrap:nowrap}nav button{white-space:nowrap}.card{border-radius:16px}}
</style>
</head>
<body>
<header><div class="headrow"><div><h1>📘 我的英文學習基地</h1><small>每天一點點，英文慢慢變簡單</small></div><span class="countpill">國中基礎字庫</span></div>
<nav>
<button data-page="home">🏠 今日任務</button><button data-page="words">🧠 單字卡</button>
<button data-page="quiz">✍️ 中翻英</button><button data-page="grammar">🧩 文法</button>
<button data-page="wrong">🔁 錯題本</button><button data-page="parent">⚙️ 家長管理</button>
</nav>
</header>
<main>
<section id="home" class="page active">
<div class="hero"><h2>今天要學什麼？ 👋</h2><p>先完成今天的任務，再複習昨天的錯題。</p></div>
<div class="grid">
<div class="card statcard"><div class="ico">🧠</div><div class="muted">今日單字</div><div class="stat">10</div></div>
<div class="card statcard"><div class="ico">✏️</div><div class="muted">今日題數</div><div class="stat">15</div></div>
<div class="card statcard"><div class="ico">🎯</div><div class="muted">答對率</div><div class="stat" id="acc">0%</div></div>
<div class="card statcard"><div class="ico">⭐</div><div class="muted">累積星星</div><div class="stat" id="stars">0 ⭐</div></div>
</div>
<div class="card"><h3>今日任務</h3>
<div class="taskrow"><div class="taskico">🧠</div><div><b>單字複習</b><div class="muted">10 個單字</div></div><button class="ghost goPage" data-go="words">開始</button></div>
<div class="taskrow"><div class="taskico">✍️</div><div><b>中翻英</b><div class="muted">10 題</div></div><button class="ghost goPage" data-go="quiz">開始</button></div>
<div class="taskrow"><div class="taskico">🧩</div><div><b>文法練習</b><div class="muted">5 題</div></div><button class="ghost goPage" data-go="grammar">開始</button></div>
</div>
</section>

<section id="words" class="page">
<div class="card wordwrap">
<div class="word" id="wEn"></div><div class="meaning" id="wZh" style="display:none"></div>
<p class="muted" style="text-align:center" id="wPos"></p>
<div class="wordactions"><button class="primary" id="flip">看答案</button> <button class="ghost" id="nextWord">下一個</button></div>
</div>
</section>

<section id="quiz" class="page">
<div class="card"><h2>中翻英</h2><h3 id="qZh"></h3>
<input id="qInput" class="answer" placeholder="輸入英文"><p><button class="primary" id="checkQ">送出</button> <button class="ghost" id="nextQ">下一題</button></p>
<div id="qFeedback"></div></div>
</section>

<section id="grammar" class="page">
<div class="card"><h2>文法中翻英</h2>
<select id="tense"><option value="present">現在式</option><option value="past">過去式</option><option value="continuous">現在進行式</option><option value="goingto">be going to 未來計畫</option></select>
<h3 id="gZh"></h3><input id="gInput" class="answer" placeholder="翻譯成英文">
<p><button class="primary" id="checkG">送出</button> <button class="ghost" id="nextG">下一題</button></p><div id="gFeedback"></div></div>
</section>

<section id="wrong" class="page"><div class="card"><h2>錯題本</h2><table><thead><tr><th>類型</th><th>題目</th><th>你的答案</th><th>正確答案</th></tr></thead><tbody id="wrongBody"></tbody></table></div></section>

<section id="parent" class="page">
<div class="hero"><h2>⚙️ 家長管理</h2><p>新增課文、管理字庫與備份學習資料。</p></div><div class="card"><h3>新增課文單字</h3><p class="muted">先用最簡單的方式追加課文單字；資料會留在這台電腦的瀏覽器。</p>
<input id="newEn" placeholder="English"><input id="newZh" placeholder="中文"><select id="newPos"><option>n.</option><option>v.</option><option>adj.</option><option>adv.</option><option>phr.</option></select>
<button class="primary" id="addWord">新增</button></div>
<div class="card"><button class="ghost" id="backup">匯出備份</button> <input type="file" id="restoreFile" accept=".json"><button class="ghost" id="restore">還原備份</button></div>
<div class="card"><h3>目前單字庫 <span class="countpill" id="wordCount"></span></h3><p class="muted">內建國中基礎字庫，可再逐步加入學校課文。</p><div class="tablebox"><p><button class="ghost" id="reset509">重新載入內建 509 筆</button></p><table><thead><tr><th>英文</th><th>中文</th><th>詞性</th></tr></thead><tbody id="wordBody"></tbody></table></div></div>
</section>
</main>
